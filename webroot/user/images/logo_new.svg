<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="190" fill="#1a1a2e" stroke="#ffd700" stroke-width="4"/>
  
  <!-- Inner Decorative Circle -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="#c41e3a" stroke-width="3"/>
  
  <!-- Outer Ring -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="#ffd700" stroke-width="2" stroke-dasharray="10,5"/>
  
  <!-- Decorative Stars -->
  <polygon points="200,30 203,40 213,40 205,47 208,57 200,50 192,57 195,47 187,40 197,40" fill="#ffd700"/>
  <polygon points="200,370 203,360 213,360 205,353 208,343 200,350 192,343 195,353 187,360 197,360" fill="#ffd700"/>
  <polygon points="30,200 40,203 40,213 47,205 57,208 50,200 57,192 47,195 40,187 40,197" fill="#ffd700"/>
  <polygon points="370,200 360,203 360,213 353,205 343,208 350,200 343,192 353,195 360,187 360,197" fill="#ffd700"/>
  
  <!-- Main Text: ALTAF -->
  <text x="200" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#ffd700">ALTAF</text>
  
  <!-- Sub Text: LOTTERY -->
  <text x="200" y="230" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#c41e3a">LOTTERY</text>
  
  <!-- Decorative Line -->
  <line x1="80" y1="190" x2="320" y2="190" stroke="#ffd700" stroke-width="2"/>
  <line x1="80" y1="215" x2="320" y2="215" stroke="#ffd700" stroke-width="2"/>
  
  <!-- Bottom Decorative Element -->
  <ellipse cx="200" cy="290" rx="80" ry="15" fill="none" stroke="#ffd700" stroke-width="2"/>
  <text x="200" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ffd700">WIN BIG</text>
  
  <!-- Side Decorative Elements -->
  <circle cx="120" cy="200" r="8" fill="#c41e3a"/>
  <circle cx="280" cy="200" r="8" fill="#c41e3a"/>
</svg>
